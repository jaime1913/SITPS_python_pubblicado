<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Paraderos SITP</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
        }

        .contenedor {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #1565C0;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: white;
        }

        button {
            margin-top: 18px;
            padding: 13px 25px;
            background-color: #2E7D32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1B5E20;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Consulta de Paraderos SITP</h1>

    <form action="/paraderos" method="GET">

        <label for="localidad">
            Seleccione una localidad:
        </label>

        <select name="localidad" id="localidad">

            {% for localidad in localidades %}

                <option value="{{ localidad }}">
                    {{ localidad }}
                </option>

            {% endfor %}

        </select>

        <button type="submit">
            Consultar paraderos
        </button>

    </form>

</div>

</body>

</html>
